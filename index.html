<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yokai Waffen Quest 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#e0e0f0}
#c{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}

#topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;background:rgba(5,5,16,0.88);
  border-bottom:1px solid #1a1a3a;pointer-events:all
}
#topbar h1{font-size:1.1rem;color:#f0c040;letter-spacing:1px}

.panel{
  background:rgba(8,8,22,0.90);border:1px solid #2a2a4a;
  border-radius:8px;padding:10px 12px;backdrop-filter:blur(4px)
}
.panel h3{color:#f0c040;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;
  margin-bottom:7px;border-bottom:1px solid #2a2a4a;padding-bottom:4px}

#left{position:absolute;left:10px;top:52px;width:195px;display:flex;flex-direction:column;gap:8px;pointer-events:all}
#right{position:absolute;right:10px;top:52px;width:195px;display:flex;flex-direction:column;gap:8px;pointer-events:all}
#bottom{position:absolute;bottom:0;left:0;right:0;pointer-events:all}

.sr{display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:3px}
.sl{color:#777}.sv{color:#e0e0f0;font-weight:bold}
.bw{background:#0a0a16;border-radius:3px;height:6px;margin-bottom:7px;overflow:hidden}
.bf{height:100%;border-radius:3px;transition:width .3s}
.hp{background:linear-gradient(90deg,#c62828,#ef5350)}
.mp{background:linear-gradient(90deg,#1565c0,#42a5f5)}
.xp{background:linear-gradient(90deg,#6a1b9a,#ab47bc)}

.gold{background:linear-gradient(135deg,#7a5200,#f0c040);color:#fff;
  padding:3px 10px;border-radius:20px;font-weight:bold;font-size:0.85rem}

/* Weapon list */
.wi{padding:5px 8px;background:#0a0a16;border:1px solid #2a2a4a;border-radius:5px;
  font-size:0.76rem;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;margin-bottom:4px;transition:border-color .15s}
.wi:hover{border-color:#f0c040}
.wi.eq{border-color:#4fc3f7;background:#091522}
.ws{color:#666;font-size:0.68rem}

/* Locations */
.lb{width:100%;padding:5px 8px;background:#0a0a16;border:1px solid #2a2a4a;
  border-radius:5px;color:#e0e0f0;font-size:0.76rem;cursor:pointer;
  text-align:left;transition:all .15s;margin-bottom:3px}
.lb:hover{border-color:#f0c040;background:#1a1a2e}
.lb.ac{border-color:#f0c040;background:#1a1a10;color:#f0c040}

/* Enemy panel */
.ehw{width:160px;margin:3px auto;background:#0a0a16;border-radius:4px;height:9px;overflow:hidden}

/* Action bar */
#actbar{background:rgba(5,5,16,0.92);border-top:1px solid #2a2a4a;padding:8px 10px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.btn{padding:9px 4px;border:none;border-radius:7px;cursor:pointer;font-size:0.76rem;
  font-weight:bold;transition:all .15s;letter-spacing:.3px}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ba{background:linear-gradient(135deg,#c62828,#ef5350);color:#fff}
.bm{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff}
.bh{background:linear-gradient(135deg,#2e7d32,#66bb6a);color:#fff}
.br{background:linear-gradient(135deg,#424242,#757575);color:#fff}
.be{background:linear-gradient(135deg,#4a148c,#ab47bc);color:#fff}

/* Log */
#log{background:rgba(5,5,16,0.92);border-top:1px solid #2a2a4a;
  padding:5px 12px;height:65px;overflow-y:auto;font-size:0.74rem;line-height:1.75}
#log::-webkit-scrollbar{width:3px}
#log::-webkit-scrollbar-thumb{background:#2a2a4a}
.ld{color:#ff7043}.lh{color:#66bb6a}.ll{color:#f0c040}
.li{color:#4fc3f7}.le{color:#ef5350}.lx{color:#ab47bc}.lk{color:#e94560;font-weight:bold}

/* Shop */
#shopbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:150;
  align-items:center;justify-content:center}
.shopm{background:#0d0d1a;border:1px solid #2a2a4a;border-radius:12px;padding:18px;
  width:390px;max-height:80vh;overflow-y:auto}
.shopm h2{color:#f0c040;margin-bottom:14px;font-size:1.1rem}
.srow{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid #1a1a3a;font-size:0.82rem}
.srow:last-child{border-bottom:none}
.sp{color:#f0c040;font-size:0.78rem}
.bb{padding:4px 11px;background:linear-gradient(135deg,#e65100,#ffa726);border:none;
  border-radius:5px;color:#fff;cursor:pointer;font-weight:bold;font-size:0.74rem}
.bb:disabled{opacity:.4;cursor:not-allowed}
.bc{margin-top:10px;width:100%;padding:9px;background:#333;border:none;
  border-radius:7px;color:#fff;cursor:pointer;font-weight:bold;font-size:0.82rem}

/* Dead */
#dead{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
#dead h2{color:#e94560;font-size:2.4rem;text-shadow:0 0 30px #e94560}
.brest{padding:11px 28px;background:linear-gradient(135deg,#c62828,#ef5350);color:#fff;
  border:none;border-radius:10px;font-size:.95rem;cursor:pointer;font-weight:bold}

/* Level toast */
#ltst{display:none;position:fixed;top:33%;left:50%;transform:translateX(-50%);
  font-size:2rem;color:#f0c040;text-shadow:0 0 30px #f0c040;
  z-index:100;pointer-events:none}
@keyframes lu{0%{opacity:0;transform:translateX(-50%) scale(.7)}40%{opacity:1;transform:translateX(-50%) scale(1.3)}100%{opacity:0;transform:translateX(-50%) scale(1.6)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="topbar">
    <h1>⛩️ Yokai Waffen Quest 3D</h1>
    <span class="gold" id="gold">💰 0 Gold</span>
    <div style="display:flex;gap:8px">
      <button id="musicBtn" class="btn" style="background:linear-gradient(135deg,#1a3a1a,#2e7d32);color:#aaffaa;padding:6px 13px;pointer-events:all" onclick="toggleMusic()">🎵 Musik: AUS</button>
      <button class="btn" style="background:linear-gradient(135deg,#e65100,#ffa726);color:#fff;padding:6px 13px;pointer-events:all" onclick="openShop()">🏪 Händler</button>
    </div>
  </div>

  <div id="left">
    <div class="panel">
      <h3>Krieger</h3>
      <div class="sr"><span class="sl">Level</span><span class="sv" id="plv">1</span></div>
      <div class="sr"><span class="sl">❤️ HP</span><span class="sv"><span id="php">100</span>/<span id="pmhp">100</span></span></div>
      <div class="bw"><div class="bf hp" id="hpb" style="width:100%"></div></div>
      <div class="sr"><span class="sl">💧 Mana</span><span class="sv"><span id="pmp">40</span>/<span id="pmmp">40</span></span></div>
      <div class="bw"><div class="bf mp" id="mpb" style="width:100%"></div></div>
      <div class="sr"><span class="sl">✨ XP</span><span class="sv"><span id="pxp">0</span>/<span id="pxn">100</span></span></div>
      <div class="bw"><div class="bf xp" id="xpb" style="width:0%"></div></div>
      <div class="sr"><span class="sl">⚔️ ATK</span><span class="sv" id="patk">15</span></div>
      <div class="sr"><span class="sl">🛡️ DEF</span><span class="sv" id="pdef">5</span></div>
    </div>
    <div class="panel">
      <h3>🗡️ Ausgerüstete Waffen</h3>
      <div id="wlist"></div>
    </div>
  </div>

  <div id="right">
    <div class="panel" id="epanel" style="display:none">
      <h3 id="etitle">Feind</h3>
      <div style="text-align:center;padding:4px 0">
        <div class="ehw"><div class="bf hp" id="ehpb" style="width:100%"></div></div>
        <div style="font-size:0.7rem;color:#777;margin-top:2px"><span id="ehp">0</span>/<span id="emhp">0</span> HP</div>
      </div>
    </div>
    <div class="panel">
      <h3>Orte</h3>
      <button class="lb ac" onclick="setLoc(this,'forest')">🌲 Dunkler Wald</button>
      <button class="lb" onclick="setLoc(this,'shrine')">⛩️ Altes Schrein</button>
      <button class="lb" onclick="setLoc(this,'mountain')">⛰️ Geisterberg</button>
      <button class="lb" onclick="setLoc(this,'city')">🏯 Verfl. Stadt</button>
      <button class="lb" onclick="setLoc(this,'void')">🌀 Das Nichts</button>
    </div>
  </div>

  <div id="bottom">
    <div id="log"><span class="li">Willkommen! Erkunde die Welt und sammle mächtige Waffen! ⚔️</span><br></div>
    <div id="actbar">
      <button class="btn ba" id="bta" disabled onclick="doAtk()">⚔️ Angriff</button>
      <button class="btn bm" id="btm" disabled onclick="doMag()">🔮 Magie</button>
      <button class="btn bh" id="bth" disabled onclick="doHeal()">💊 Heilen</button>
      <button class="btn br" id="btr" disabled onclick="doRun()">🏃 Fliehen</button>
      <button class="btn be" id="bte" onclick="doExp()">🔍 Erkunden</button>
    </div>
  </div>
</div>

<div id="ltst">⭐ LEVEL UP! ⭐</div>

<div id="dead">
  <div style="font-size:4rem">💀</div>
  <h2>Du bist gefallen!</h2>
  <p style="color:#777">Die Yokais haben dich bezwungen...</p>
  <button class="brest" onclick="restart()">🔄 Neu starten</button>
</div>

<div id="shopbg">
  <div class="shopm">
    <h2>🏪 Waffenhändler</h2>
    <div id="shoplist"></div>
    <button class="bc" onclick="closeShop()">✕ Schließen</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ── RENDERER ──────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.014);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
const CAM_BASE = new THREE.Vector3(0, 9, 18);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 2.5, 0);

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

// ── LIGHTS ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a1a2e, 2.5));

const sun = new THREE.DirectionalLight(0x8899ff, 2.5);
sun.position.set(-8, 15, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
scene.add(sun);

const rLight = new THREE.PointLight(0xff2244, 10, 30);
rLight.position.set(5, 4, 3);
scene.add(rLight);

const bLight = new THREE.PointLight(0x2244ff, 10, 30);
bLight.position.set(-5, 4, 3);
scene.add(bLight);

// Per-location ambient color light
const locAmbient = new THREE.AmbientLight(0x001a00, 3);
scene.add(locAmbient);

// ── ENVIRONMENT ───────────────────────────────────────────
// Ground
const gnd = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshPhongMaterial({color:0x080814, shininess:80, specular:0x111133})
);
gnd.rotation.x = -Math.PI/2;
gnd.receiveShadow = true;
scene.add(gnd);

scene.add(new THREE.GridHelper(50, 28, 0x111144, 0x0d0d2a));

// Arena ring
const ring = new THREE.Mesh(
  new THREE.RingGeometry(3.8, 4.3, 64),
  new THREE.MeshBasicMaterial({color:0x3333cc, side:THREE.DoubleSide})
);
ring.rotation.x = -Math.PI/2;
ring.position.y = 0.01;
scene.add(ring);

// Inner glow disc
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(3.8, 64),
  new THREE.MeshBasicMaterial({color:0x040420, transparent:true, opacity:0.7, side:THREE.DoubleSide})
);
disc.rotation.x = -Math.PI/2;
disc.position.y = 0.005;
scene.add(disc);

// Torii gate
(function buildTorii() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({color:0x8b0000, emissive:0x330000, shininess:40});
  const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.34,10,8), mat);
  pL.position.set(-4,5,-12); pL.castShadow = true; g.add(pL);
  const pR = pL.clone(); pR.position.x = 4; g.add(pR);
  const top = new THREE.Mesh(new THREE.BoxGeometry(10,0.5,0.55), mat);
  top.position.set(0,10.3,-12); g.add(top);
  const cL = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.38,0.55), mat);
  cL.position.set(-5.6,10.12,-12); cL.rotation.z = 0.14; g.add(cL);
  const cR = cL.clone(); cR.position.x = 5.6; cR.rotation.z = -0.14; g.add(cR);
  const bot = new THREE.Mesh(new THREE.BoxGeometry(9.5,0.42,0.48), mat);
  bot.position.set(0,8,-12); g.add(bot);
  scene.add(g);
})();

// Mountains
[[-18,8,-22],[-10,6,-24],[-3,7.5,-25],[7,9,-23],[14,6,-21],[20,7.5,-20]].forEach(([x,s,z])=>{
  const m = new THREE.Mesh(new THREE.ConeGeometry(s*1.3, s*2.8, 6),
    new THREE.MeshPhongMaterial({color:0x08081e, emissive:0x040410}));
  m.position.set(x, s*1.4-1, z);
  scene.add(m);
});

// ── CHARACTER BUILDERS ────────────────────────────────────
function mkMat(c, e=0, s=80) {
  return new THREE.MeshPhongMaterial({color:c, emissive:e, shininess:s});
}

function buildPlayer() {
  const g = new THREE.Group();
  const body  = mkMat(0x22447a, 0x051030, 80);
  const armor = mkMat(0x334466, 0x111122, 120);
  const skin  = mkMat(0xffddbb, 0, 40);

  const add = (geo, mat, x,y,z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x,y,z); m.castShadow = true; g.add(m); return m;
  };

  add(new THREE.BoxGeometry(0.38,1.1,0.38), body, -0.22,0.55,0);
  add(new THREE.BoxGeometry(0.38,1.1,0.38), body,  0.22,0.55,0);
  add(new THREE.BoxGeometry(0.95,1.2,0.52), armor, 0,1.5,0);
  add(new THREE.BoxGeometry(0.4,0.4,0.4), armor, -0.68,1.95,0);
  add(new THREE.BoxGeometry(0.4,0.4,0.4), armor,  0.68,1.95,0);
  add(new THREE.BoxGeometry(0.3,0.9,0.3), body, -0.65,1.4,0);
  add(new THREE.BoxGeometry(0.3,0.9,0.3), body,  0.65,1.4,0);
  add(new THREE.BoxGeometry(0.72,0.72,0.7), skin, 0,2.42,0);
  add(new THREE.BoxGeometry(0.78,0.44,0.78), armor, 0,2.72,0);

  const eyeM = new THREE.MeshBasicMaterial({color:0x4fc3f7});
  const eL = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.1,0.05), eyeM);
  eL.position.set(-0.18,2.44,0.37); g.add(eL);
  const eR = eL.clone(); eR.position.x = 0.18; g.add(eR);

  const hook = new THREE.Object3D();
  hook.name = 'hook'; hook.position.set(0.72,1.0,0.1); g.add(hook);
  return g;
}

const YOKAI_BUILD = {
  kitsune() {
    const g = new THREE.Group();
    const fur  = mkMat(0xff6600, 0x441100, 30);
    const dark = mkMat(0x331100, 0, 20);
    const eM   = new THREE.MeshBasicMaterial({color:0xffff00});
    const add  = (geo,mat,x,y,z) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };

    add(new THREE.BoxGeometry(1.1,1.6,0.8), fur, 0,0.8,0);
    add(new THREE.BoxGeometry(0.9,0.9,0.85), fur, 0,2.1,0);
    add(new THREE.BoxGeometry(0.5,0.35,0.4), dark, 0,2.0,0.53);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.2,0.55,4), fur);
    ear.position.set(-0.28,2.76,0); g.add(ear);
    const earR = ear.clone(); earR.position.x=0.28; g.add(earR);
    const eL = new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6), eM);
    eL.position.set(-0.22,2.18,0.44); g.add(eL);
    const eR = eL.clone(); eR.position.x=0.22; g.add(eR);
    for (let i=0;i<3;i++){
      const t=new THREE.Mesh(new THREE.ConeGeometry(0.17,0.85,5), fur);
      t.position.set(-0.28+i*0.28,0.5,-0.72); t.rotation.x=-0.55+i*0.08; g.add(t);
    }
    for (let i=0;i<4;i++){
      const leg=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.6,0.25),dark);
      leg.position.set(i%2===0?-0.3:0.3, 0.3, i<2?0.22:-0.22); g.add(leg);
    }
    return g;
  },

  oni() {
    const g = new THREE.Group();
    const red  = mkMat(0xcc0000,0x440000,60);
    const dark = mkMat(0x220000,0,40);
    const eM   = new THREE.MeshBasicMaterial({color:0xffffff});
    const pM   = new THREE.MeshBasicMaterial({color:0xff0000});
    const add  = (geo,mat,x,y,z) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };

    add(new THREE.BoxGeometry(1.8,2.2,1.2), red, 0,1.1,0);
    add(new THREE.BoxGeometry(1.4,1.2,1.2), red, 0,2.85,0);
    const hMat = mkMat(0xccaa00,0,80);
    const hL=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.82,6),hMat); hL.position.set(-0.5,3.72,0); g.add(hL);
    const hR=hL.clone(); hR.position.x=0.5; g.add(hR);
    add(new THREE.BoxGeometry(0.55,1.5,0.5), red, -1.3,1.5,0);
    add(new THREE.BoxGeometry(0.55,1.5,0.5), red,  1.3,1.5,0);
    const eL=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8),eM); eL.position.set(-0.35,2.94,0.62); g.add(eL);
    const eR=eL.clone(); eR.position.x=0.35; g.add(eR);
    const pL=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,6),pM); pL.position.set(-0.35,2.94,0.74); g.add(pL);
    const pR=pL.clone(); pR.position.x=0.35; g.add(pR);
    add(new THREE.BoxGeometry(0.6,1.0,0.6), dark, -0.45,0.5,0);
    add(new THREE.BoxGeometry(0.6,1.0,0.6), dark,  0.45,0.5,0);
    return g;
  },

  tengu() {
    const g = new THREE.Group();
    const dark  = mkMat(0x1a1a3a,0x070730,80);
    const beakM = mkMat(0xff6600,0,60);
    const eM    = new THREE.MeshBasicMaterial({color:0xff0000});
    const wMat  = mkMat(0x151530,0x060618,40);
    const add   = (geo,mat,x,y,z) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };

    add(new THREE.BoxGeometry(1.0,1.8,0.7), dark, 0,0.9,0);
    add(new THREE.BoxGeometry(0.85,0.85,0.85), dark, 0,2.2,0);
    const bk=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.9,6),beakM);
    bk.rotation.x=Math.PI/2; bk.position.set(0,2.2,0.73); g.add(bk);
    const wL=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,1.2),wMat);
    wL.position.set(-1.9,1.6,0); wL.rotation.z=0.28; g.add(wL);
    const wR=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,1.2),wMat);
    wR.position.set(1.9,1.6,0); wR.rotation.z=-0.28; g.add(wR);
    const eL=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),eM); eL.position.set(-0.24,2.3,0.44); g.add(eL);
    const eR=eL.clone(); eR.position.x=0.24; g.add(eR);
    add(new THREE.CylinderGeometry(0.1,0.1,0.9,5), dark, -0.2,0.45,0);
    add(new THREE.CylinderGeometry(0.1,0.1,0.9,5), dark,  0.2,0.45,0);
    return g;
  },

  skel() {
    const g = new THREE.Group();
    const bone = mkMat(0xddddc8,0x333322,30);
    const eM   = new THREE.MeshBasicMaterial({color:0x00ff88});
    const add  = (geo,mat,x,y,z) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; g.add(m); return m; };

    add(new THREE.BoxGeometry(2.0,2.5,1.0), bone, 0,1.25,0);

    add(new THREE.CylinderGeometry(0.2,0.18,1.5,6), bone,  0.5,0.75,0);
    return g;
  },

  void_() {
    const g = new THREE.Group();
    const body = mkMat(0x220044,0x110022,100);
    body.transparent=true; body.opacity=0.88;
    const eM   = new THREE.MeshBasicMaterial({color:0xff00ff});

    const b=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,10),body); b.position.y=2; b.castShadow=true; g.add(b);
    for(let i=0;i<6;i++){
      const ang=(i/6)*Math.PI*2;
      const t=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.2,1.5,5),body);
      t.position.set(Math.cos(ang)*0.8,1.0,Math.sin(ang)*0.8);
      t.rotation.z=Math.sin(ang)*0.5; t.rotation.x=Math.cos(ang)*0.5; g.add(t);
    }
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),core); c.position.y=2; g.add(c);
    for(let i=0;i<3;i++){
      const ang=(i/3)*Math.PI*2;
      const e=new THREE.Mesh(new THREE.SphereGeometry(0.16,6,6),eM);
      e.position.set(Math.cos(ang)*0.72,2.2+Math.sin(ang)*0.3,Math.sin(ang)*0.72); g.add(e);
    }
    return g;
  }
};

const particles = [];
function spawnParts(from, to, color, n=28) {
  const mat = new THREE.MeshBasicMaterial({color, transparent:true});
  const dir = new THREE.Vector3().subVectors(to, from).normalize();
  for (let i=0;i<n;i++) {
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.07+Math.random()*0.09,4,4), mat.clone());
    p.position.copy(from);
    p.userData.v=new THREE.Vector3(
      dir.x*(2+Math.random()*3)+(Math.random()-.5)*2,
      dir.y*(2+Math.random()*3)+Math.random()*2.5,
      dir.z*(2+Math.random()*3)+(Math.random()-.5)*2
    );
    p.userData.life=p.userData.maxLife=0.55+Math.random()*0.4;
    scene.add(p); particles.push(p);
  }
}
function burstParts(pos, color, n=18) {
  const mat = new THREE.MeshBasicMaterial({color, transparent:true});
  for (let i=0;i<n;i++) {
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1), mat.clone());
    p.position.copy(pos).add(new THREE.Vector3((Math.random()-.5)*.6,Math.random()*.5,(Math.random()-.5)*.6));
    p.userData.v=new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5);
    p.userData.life=p.userData.maxLife=0.4;
    scene.add(p); particles.push(p);
  }
}
function tickParts(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.userData.life-=dt;
    if (p.userData.life<=0) { scene.remove(p); particles.splice(i,1); continue; }
    p.position.addScaledVector(p.userData.v, dt);
    p.userData.v.y-=6*dt;
    const t=p.userData.life/p.userData.maxLife;
    p.material.opacity=t; p.scale.setScalar(t*.8+.2);
  }
}

// ── COMBAT ────────────────────────────────────────────────
function tatk(){return G.atk+(WEAPONS[G.weq]?.atk||0);}
function tdef(){return G.def+(WEAPONS[G.weq]?.def||0);}
function dmg(a,d){return Math.max(1,Math.round((a-d)*(0.8+Math.random()*0.4)));}

function pFrom(){return pMesh?pMesh.position.clone().add(new THREE.Vector3(0,2,0)):PPOS.clone();}
function eFrom(){return eMesh?eMesh.position.clone().add(new THREE.Vector3(0,2,0)):EPOS.clone();}

function doExp() {
  if (G.battle) return;
  const list=YOKAI[G.loc];
  const base=list[Math.floor(Math.random()*list.length)];
  const lm=1+(G.lv-1)*0.18;
  G.enemy={...base,hp:Math.round(base.hp*lm),mhp:Math.round(base.hp*lm),
            atk:Math.round(base.atk*lm),def:Math.round(base.def*lm)};
  G.battle=true; setBtns(true);
  spawnEnemy(base.type);
  log(`⚔️ <b>${G.enemy.name}</b> erscheint!`,'le');
  renderUI();
}

function doAtk() {
  if (!G.battle) return;
  const w=WEAPONS[G.weq];
  let d=dmg(tatk(), w.sp==='pierce'?G.enemy.def*0.5:G.enemy.def);
  if (w.sp==='crit'&&Math.random()<.20){d*=2;log('💥 Kritischer Treffer!','ll');}
  G.enemy.hp-=d;
  log(`⚔️ <b>${d} Schaden</b> an ${G.enemy.name}!`,'ld');
  spawnParts(pFrom(),eFrom(),w.sp==='crit'?0xffdd00:0xff4422);
  if(G.enemy.hp<=0){setTimeout(winBattle,300);return;}
  burstParts(eFrom(),0xff2200); shake(0.22,0.2);
  renderUI();
  setTimeout(()=>{
    if(!G.battle)return;
    if(w.sp==='stun'&&Math.random()<.30)log(`💫 ${G.enemy.name} betäubt!`,'li');
    else enemyAtk();
  },420);
}

function doMag() {
  if (!G.battle||G.mp<14){if(G.mp<14)log('Zu wenig Mana!','li');return;}
  G.mp-=14;
  const w=WEAPONS[G.weq];
  const d=dmg(tatk()*(w.sp==='magic_amp'?2.2:1.7),G.enemy.def*0.4);
  G.enemy.hp-=d;
  log(`🔮 <b>${d} magischer Schaden</b>!`,'li');
  spawnParts(pFrom(),eFrom(),0x8822ff,40);
  if(G.enemy.hp<=0){setTimeout(winBattle,300);return;}
  burstParts(eFrom(),0x8800ff); shake(0.16,0.18);
  renderUI();
  setTimeout(()=>{if(G.battle)enemyAtk();},420);
}

function doHeal() {
  if (!G.battle||G.mp<10){if(G.mp<10)log('Zu wenig Mana!','li');return;}
  G.mp-=10;
  const h=Math.round(20+G.lv*4+Math.random()*14);
  G.hp=Math.min(G.mhp,G.hp+h);
  log(`💊 +${h} HP geheilt!`,'lh');
  burstParts(pFrom(),0x00ff88); renderUI();
  setTimeout(()=>{if(G.battle)enemyAtk();},320);
}

function doRun() {
  if (!G.battle) return;
  if (Math.random()<.55){log('🏃 Erfolgreich geflohen!','li');endBattle();}
  else{log('🏃 Flucht fehlgeschlagen!','le');enemyAtk();}
}

function enemyAtk() {
  if (!G.battle||!G.enemy) return;
  const d=Math.max(1,dmg(G.enemy.atk,tdef()));
  G.hp-=d;
  log(`💢 ${G.enemy.name} trifft! <b>${d} Schaden</b>!`,'le');
  spawnParts(eFrom(),pFrom(),0xff2200,20);
  burstParts(pFrom(),0xff0000); shake(0.3,0.22);
  if(G.hp<=0){G.hp=0;renderUI();setTimeout(playerDead,400);return;}
  renderUI();
}

function winBattle() {
  if (!G.enemy) return;
  G.xp+=G.enemy.xp;
  const g=G.enemy.gold[0]+Math.floor(Math.random()*(G.enemy.gold[1]-G.enemy.gold[0]+1));
  G.gold+=g;
  log(`💀 <b>${G.enemy.name}</b> besiegt!`,'lk');
  log(`✨ +${G.enemy.xp} XP | 💰 +${g} Gold`,'ll');
  const drop=G.enemy.drop;
  if(drop&&Math.random()<drop.p&&!G.wown.includes(drop.id)){
    G.wown.push(drop.id);
    log(`🗡️ Waffe erbeutet: <b>${WEAPONS[drop.id].name}</b>! (${WEAPONS[drop.id].desc})`,'ll');
  }
  if(eMesh) spawnParts(eFrom(),eFrom().clone().add(new THREE.Vector3(0,4,0)),0xff4400,70);
  checkLvl(); endBattle(); renderUI();
}

function checkLvl() {
  while(G.xp>=G.xpn){
    G.xp-=G.xpn; G.lv++;
    G.xpn=Math.round(G.xpn*1.45);
    G.mhp+=25; G.mmp+=12; G.hp=G.mhp; G.mp=G.mmp;
    G.atk+=4; G.def+=2;
    log(`⭐ <b>LEVEL ${G.lv}!</b> ATK+4, DEF+2, HP+25!`,'lx');
    const el=document.getElementById('ltst');
    el.style.display='block'; el.style.animation='lu 1.3s ease forwards';
    setTimeout(()=>{el.style.display='none';el.style.animation='';},1400);
    if(pMesh) spawnParts(pFrom(),pFrom().clone().add(new THREE.Vector3(0,6,0)),0xffdd00,90);
  }
}

function endBattle(){G.battle=false;G.enemy=null;setBtns(false);removeEnemy();renderUI();}
function playerDead(){document.getElementById('dead').style.display='flex';}
function restart(){
  document.getElementById('dead').style.display='none';
  initG();
  document.getElementById('log').innerHTML='';
  setBtns(false); removeEnemy();
  spawnPlayer(); applyWeapon3D('fists');
  log('🔄 Ein neues Abenteuer beginnt!','li');
  renderUI();
}

// ── WEAPON EQUIP ──────────────────────────────────────────
function equipW(id) {
  if (!G.wown.includes(id)) return;
  G.weq=id; applyWeapon3D(id);
  log(`🗡️ Ausgerüstet: <b>${WEAPONS[id].name}</b> — ${WEAPONS[id].desc}`,'li');
  renderUI();
}

// ── SHOP ──────────────────────────────────────────────────
function openShop(){
  const el=document.getElementById('shoplist');
  el.innerHTML='<div style="color:#aaa;font-size:.75rem;margin-bottom:8px">⚔️ Waffen:</div>';
  SHOP_W.forEach(({id,cost})=>{
    const w=WEAPONS[id]; const owned=G.wown.includes(id);
    const r=document.createElement('div'); r.className='srow';
    r.innerHTML=`<div><b>${w.name}</b><br><small style="color:#666">${w.desc} | ATK+${w.atk}</small></div>
    <div style="text-align:right"><div class="sp">${owned?'✅ Besitzt':cost+' 💰'}</div>
    ${owned?'':`<button class="bb" onclick="buyW('${id}',${cost})" ${G.gold<cost?'disabled':''}>Kaufen</button>`}</div>`;
    el.appendChild(r);
  });
  const h=document.createElement('div');
  h.style.cssText='color:#aaa;font-size:.75rem;margin:11px 0 7px;border-top:1px solid #1a1a3a;padding-top:9px';
  h.textContent='🧪 Items:'; el.appendChild(h);
  SHOP_I.forEach(item=>{
    const r=document.createElement('div'); r.className='srow';
    r.innerHTML=`<div><b>${item.emoji} ${item.name}</b></div>
    <div style="text-align:right"><div class="sp">${item.cost} 💰</div>
    <button class="bb" onclick="buyI('${item.name}')" ${G.gold<item.cost?'disabled':''}>Kaufen</button></div>`;
    el.appendChild(r);
  });
  document.getElementById('shopbg').style.display='flex';
}
function closeShop(){document.getElementById('shopbg').style.display='none';}
function buyW(id,cost){
  if(G.gold<cost||G.wown.includes(id))return;
  G.gold-=cost; G.wown.push(id);
  log(`🗡️ Waffe gekauft: <b>${WEAPONS[id].name}</b>!`,'ll');
  closeShop(); openShop(); renderUI();
}
function buyI(name){
  const item=SHOP_I.find(i=>i.name===name);
  if(!item||G.gold<item.cost)return;
  G.gold-=item.cost;
  switch(item.effect){
    case 'heal':G.hp=Math.min(G.mhp,G.hp+item.val);log(`🧴 +${item.val} HP!`,'lh');break;
    case 'mana':G.mp=Math.min(G.mmp,G.mp+item.val);log(`💧 +${item.val} Mana!`,'li');break;
    case 'fullheal':G.hp=G.mhp;G.mp=G.mmp;log('💊 Vollständig geheilt!','lh');break;
    case 'xp':G.xp+=item.val;checkLvl();log(`📜 +${item.val} XP!`,'lx');break;
  }
  renderUI(); closeShop(); openShop();
}

// ── RENDER LOOP ───────────────────────────────────────────
const clk=new THREE.Clock();

renderer.setAnimationLoop(()=>{
  const dt=clk.getDelta(), t=clk.getElapsedTime();

  if(pMesh){pMesh.position.y=Math.sin(t*1.2)*0.05;pMesh.rotation.y=Math.PI*.18+Math.sin(t*.5)*.05;}
  if(eMesh){eMesh.position.y=Math.sin(t*1.5+1)*0.08;eMesh.rotation.y=-Math.PI*.18+Math.sin(t*.7+.5)*.07;}

  // Arena ring pulse (location-colored)
  const p=0.5+Math.sin(t*2)*0.5;
  ring.material.color.setRGB(locRingColor[0]*p, locRingColor[1]*p, locRingColor[2]*p);

  // Light pulse
  rLight.intensity=10+Math.sin(t*2.3)*3;
  bLight.intensity=10+Math.sin(t*1.8+1)*3;

  // Camera shake
  if(shakeT>0){
    shakeT-=dt;
    const s=shakeA*(shakeT/.25);
    camera.position.set(CAM_BASE.x+(Math.random()-.5)*s,CAM_BASE.y+(Math.random()-.5)*s*.5,CAM_BASE.z+(Math.random()-.5)*s);
  } else {
    camera.position.lerp(CAM_BASE,.1);
  }

  tickParts(dt);
  renderer.render(scene,camera);
});

// ── JAPANESE MUSIC (Web Audio API, Hirajoshi scale) ───────
const Music = (() => {
  // Hirajoshi pentatonic scale frequencies (distinctly Japanese)
  const A2=110.00, E3=164.81, F3=174.61,
        A3=220.00, B3=246.94, C4=261.63, E4=329.63, F4=349.23,
        A4=440.00, B4=493.88, C5=523.25, E5=659.25;

  // Melody pattern: [freq(0=rest), duration_in_beats]
  const MEL=[
    [A4,1],[C5,.5],[B4,.5],[A4,2],
    [E4,1],[F4,1],[A4,2],
    [C5,1],[E5,.5],[C5,.5],[B4,2],
    [A4,1],[F4,.5],[E4,.5],[A3,2],
    [E4,1],[F4,1],[A4,1],[B4,1],[A4,2],
    [C5,1],[B4,.5],[A4,.5],[F4,1],[E4,1],[C4,2],
    [A3,2],[E4,1],[F4,1],[A4,4],
    [0,2],
  ];

  // Bass drone
  const BASS=[
    [A2,3],[E3,1],[A2,2],[F3,2],
    [A2,4],[E3,2],[A2,2],
    [A2,3],[E3,1],[F3,1],[A2,1],[E3,2],[A2,2],
  ];

  let ctx=null,mGain=null,dly=null;
  let on=false,mI=0,bI=0,mT=0,bT=0,tmr=null;
  const BPM=66, B=60/BPM;

  function setup() {
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    mGain=ctx.createGain(); mGain.gain.value=0; mGain.connect(ctx.destination);
    dly=ctx.createDelay(3); dly.delayTime.value=0.55;
    const fb=ctx.createGain(); fb.gain.value=0.2;
    const dg=ctx.createGain(); dg.gain.value=0.18;
    dly.connect(fb); fb.connect(dly); dly.connect(dg); dg.connect(mGain);
  }

  function note(f,t,dur,v,type='sine') {
    if(!f||!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+0.06);
    g.gain.setValueAtTime(v*0.5,t+dur*B*0.45);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur*B*0.92);
    o.connect(g); g.connect(mGain); g.connect(dly);
    o.start(t); o.stop(t+dur*B+0.08);
  }

  function tick() {
    if(!on) return;
    const now=ctx.currentTime, look=0.5;
    while(mT<now+look){
      const n=MEL[mI%MEL.length];
      note(n[0],mT,n[1],.26); mT+=n[1]*B; mI++;
    }
    while(bT<now+look){
      const n=BASS[bI%BASS.length];
      note(n[0],bT,n[1],.13,'triangle'); bT+=n[1]*B; bI++;
    }
    tmr=setTimeout(tick,130);
  }

  return {
    toggle() {
      if(!ctx) setup();
      if(on) {
        on=false; clearTimeout(tmr);
        mGain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.6);
        return false;
      } else {
        on=true;
        mT=ctx.currentTime+0.15; bT=ctx.currentTime+0.15;
        mGain.gain.linearRampToValueAtTime(0.32,ctx.currentTime+0.8);
        tick(); return true;
      }
    }
  };
})();

function toggleMusic() {
  const isOn=Music.toggle();
  const btn=document.getElementById('musicBtn');
  btn.textContent=isOn?'🎵 Musik: AN':'🔇 Musik: AUS';
  btn.style.background=isOn?'linear-gradient(135deg,#1a4a1a,#4caf50)':'linear-gradient(135deg,#1a3a1a,#2e7d32)';
  btn.style.color=isOn?'#ccffcc':'#aaffaa';
}
